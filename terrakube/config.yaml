name: Terrakube
version: 1.0.1
slug: terrakube
description: Terrakube UI and API server addon
url: "https://github.com/Astavelopment-Home-Assistant/homeassistant-addons"
startup: application
arch:
  - aarch64
  - amd64
ports:
  8080/tcp: 8080
  3000/tcp: 3000
options:
  database_url: ""
  redis_url: ""
  api_base_url: "http://localhost:8080"
  ui_base_url: "http://localhost:3000"
  workspace_storage: "/ssl/workspace"
schema:
  database_url: "str"
  redis_url: "str"
  api_base_url: "match(^https?://.*)"
  ui_base_url: "match(^https?://.*)"
  workspace_storage: "str"
